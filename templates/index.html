<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JARVIS LeadHunter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>

<!-- ── Topbar ──────────────────────────────────────────────────────────────── -->
<header class="topbar">
  <div class="topbar-brand">
    <span class="brand-dot"></span>
    <span class="brand-name">JARVIS</span>
    <span class="brand-sub">LeadHunter</span>
  </div>

  <div class="topbar-controls">
    <!-- KI-Auswahl -->
    <div class="ctrl-group">
      <span class="ctrl-label">KI</span>
      <div class="toggle-row" id="ai-toggle">
        <button class="tgl active" data-val="local">Lokal</button>
        <button class="tgl" data-val="cloud">Claude</button>
        <button class="tgl" data-val="both">Beides</button>
      </div>
    </div>

    <!-- Modus -->
    <div class="ctrl-group">
      <span class="ctrl-label">Modus</span>
      <div class="toggle-row" id="mode-toggle">
        <button class="tgl active" data-val="website">Webseiten</button>
        <button class="tgl disabled" data-val="bilder" title="Bald verfügbar">Bilder</button>
        <button class="tgl disabled" data-val="video"  title="Bald verfügbar">TikTok</button>
      </div>
    </div>

    <!-- Start / Stop -->
    <button class="btn-start" id="btn-start" onclick="toggleScraper()">
      <span class="btn-icon">▶</span>
      <span class="btn-text">START</span>
    </button>
  </div>

  <div class="live-badge" id="live-badge">
    <span class="live-dot"></span>
    <span id="live-text">OFFLINE</span>
  </div>
</header>

<!-- ── Main Layout ─────────────────────────────────────────────────────────── -->
<main class="layout">

  <!-- ── Linke Sidebar: Stats ────────────────────────────────────────── -->
  <aside class="sidebar-left">
    <div class="stat-card">
      <div class="stat-val" id="s-total">0</div>
      <div class="stat-lbl">Leads gefunden</div>
    </div>
    <div class="stat-card hot">
      <div class="stat-val" id="s-hot">0</div>
      <div class="stat-lbl">🔴 Hot Leads</div>
    </div>
    <div class="stat-card warm">
      <div class="stat-val" id="s-warm">0</div>
      <div class="stat-lbl">🟡 Warm Leads</div>
    </div>
    <div class="stat-card cold">
      <div class="stat-val" id="s-cold">0</div>
      <div class="stat-lbl">🔵 Cold Leads</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="s-noweb">0%</div>
      <div class="stat-lbl">Ohne Website</div>
    </div>

    <div class="finder-list" id="finder-list">
      <div class="finder-title">Quellen</div>
    </div>

    <button class="btn-export" onclick="exportCSV()">↓ CSV Export</button>
  </aside>

  <!-- ── Chat-Feed (Mitte) ─────────────────────────────────────────────── -->
  <section class="feed-wrap">
    <div class="feed-header">
      <span class="feed-title">Live Feed</span>
      <span class="feed-count" id="feed-count">0 Nachrichten</span>
      <button class="btn-clear" onclick="clearFeed()">Leeren</button>
    </div>

    <div class="chat-feed" id="chat-feed">
      <div class="feed-empty" id="feed-empty">
        <div class="empty-icon">◉</div>
        <div class="empty-text">Scraper starten um Leads zu empfangen</div>
        <div class="empty-sub">Wähle KI-Modus und drücke START</div>
      </div>
    </div>
  </section>

  <!-- ── Rechte Sidebar ────────────────────────────────────────────────── -->
  <aside class="sidebar-right">
    <div class="filter-block">
      <div class="filter-title">Filter</div>
      <select class="flt-sel" id="flt-typ" onchange="applyFilter()">
        <option value="">Alle Typen</option>
        <option value="Hot">🔴 Hot</option>
        <option value="Warm">🟡 Warm</option>
        <option value="Cold">🔵 Cold</option>
      </select>
      <select class="flt-sel" id="flt-web" onchange="applyFilter()">
        <option value="">Website: alle</option>
        <option value="0">Kein Website</option>
        <option value="1">Hat Website</option>
      </select>
      <select class="flt-sel" id="flt-bl" onchange="applyFilter()">
        <option value="">Alle Regionen</option>
        <option value="Berlin">Berlin</option>
        <option value="Schleswig-Holstein">Schleswig-Holstein</option>
      </select>
    </div>

    <div class="recent-title">Letzte Hot Leads</div>
    <div class="recent-list" id="recent-hot"></div>
  </aside>

</main>

<!-- ── Lead Detail Modal ─────────────────────────────────────────────────── -->
<div class="modal-backdrop" id="modal-bg" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <div id="modal-content"></div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
