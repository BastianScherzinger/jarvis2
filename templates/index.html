<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>JARVIS LeadHunter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>

<!-- ══════════════════════════════ TOPBAR ══════════════════════════════════ -->
<header class="topbar">
  <div class="brand">
    <canvas class="arc-canvas" id="arc-canvas" width="32" height="32"></canvas>
    <div>
      <div class="brand-name">JARVIS</div>
      <div class="brand-sub">LeadHunter</div>
    </div>
  </div>

  <div class="topbar-center">
    <!-- Claude Toggle -->
    <div class="claude-toggle" id="claude-toggle" onclick="toggleClaude()">
      <span class="ct-icon">✦</span>
      <span class="ct-label">Claude</span>
      <div class="ct-switch" id="ct-switch">
        <div class="ct-knob"></div>
      </div>
      <span class="ct-state" id="ct-state">OFF</span>
    </div>
  </div>

  <div class="topbar-right">
    <div class="live-ind" id="live-ind">
      <span class="live-dot-wrap"><span class="live-dot"></span></span>
      <span id="live-lbl">OFFLINE</span>
    </div>
    <button class="start-btn" id="start-btn" onclick="toggleScraper()">
      <span id="si">▶</span>&nbsp;<span id="st">START</span>
    </button>
    <button class="export-btn" onclick="exportCSV()">↓ CSV</button>
  </div>
</header>

<!-- ══════════════════════════════ LAYOUT ═══════════════════════════════════ -->
<main class="layout">

  <!-- ── LEFT: Sphere + Stats ──────────────────────────────────────────── -->
  <aside class="left-panel">

    <!-- 3D Lead-Sphäre -->
    <div class="sphere-wrap">
      <canvas id="sphere-canvas"></canvas>
      <div class="sphere-label">
        <span class="sphere-count" id="sphere-count">0</span>
        <span class="sphere-sub">Leads</span>
      </div>
    </div>

    <!-- Stats Blöcke -->
    <div class="stat-grid">
      <div class="s-block total">
        <div class="s-num" id="s-total">0</div>
        <div class="s-lbl">Gesamt</div>
      </div>
      <div class="s-block hot">
        <div class="s-num" id="s-hot">0</div>
        <div class="s-lbl">Hot</div>
      </div>
      <div class="s-block warm">
        <div class="s-num" id="s-warm">0</div>
        <div class="s-lbl">Warm</div>
      </div>
      <div class="s-block cold">
        <div class="s-num" id="s-cold">0</div>
        <div class="s-lbl">Cold</div>
      </div>
    </div>

    <div class="metric-pill">
      <span>Ohne Website</span>
      <span class="mp-val accent" id="s-noweb">0%</span>
    </div>
    <div class="metric-pill">
      <span>Mit Telefon</span>
      <span class="mp-val" id="s-tel">0</span>
    </div>

    <button class="text-btn red" onclick="clearFeed()">✕ Feed leeren</button>
  </aside>

  <!-- ── CENTER: Chat Feed ──────────────────────────────────────────────── -->
  <section class="feed-section">
    <div class="feed-head">
      <span class="feed-title">Live Feed</span>
      <span class="feed-cnt" id="feed-cnt">0</span>
    </div>
    <div class="chat-feed" id="chat-feed">
      <div class="empty-state" id="empty-state">
        <div class="empty-icon">◎</div>
        <div class="empty-title">Bereit</div>
        <div class="empty-sub">START drücken — Leads erscheinen hier</div>
      </div>
    </div>
  </section>

  <!-- ── RIGHT: Quellen-Diagramm ───────────────────────────────────────── -->
  <aside class="right-panel">
    <div class="panel-title">Quellen</div>
    <div class="source-chart" id="source-chart">
      <!-- Dynamisch befüllt -->
    </div>

    <div class="panel-title" style="margin-top:16px">Filter</div>
    <select class="flt" id="flt-typ" onchange="applyFilter()">
      <option value="">Alle Typen</option>
      <option value="Hot">🔴 Hot</option>
      <option value="Warm">🟡 Warm</option>
      <option value="Cold">🔵 Cold</option>
    </select>
    <select class="flt" id="flt-web" onchange="applyFilter()">
      <option value="">Website: alle</option>
      <option value="0">✗ Ohne Website</option>
      <option value="1">✓ Mit Website</option>
    </select>
    <select class="flt" id="flt-bl" onchange="applyFilter()">
      <option value="">Alle Regionen</option>
      <option value="Berlin">Berlin</option>
      <option value="Schleswig-Holstein">Schleswig-Holstein</option>
    </select>

    <div class="panel-title" style="margin-top:16px">Hot Leads</div>
    <div class="hot-list" id="hot-list">
      <div class="hot-empty">Noch keine Hot Leads</div>
    </div>
  </aside>

</main>

<!-- ══════════════════════════ MODAL ════════════════════════════════════════ -->
<div class="modal-bg" id="modal-bg" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <div id="modal-inner"></div>
</div>

<script src="/static/js/app.js"></script>
</body>
</html>
